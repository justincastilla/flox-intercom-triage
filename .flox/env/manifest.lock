    "schema-version": "1.14.0",
    "install": {
      "cloudflared": {
        "pkg-path": "cloudflared"
      },
      "python": {
        "pkg-path": "python312",
        "outputs": "all"
      },
      "ripgrep": {
        "pkg-path": "ripgrep",
        "outputs": "all"
      },
      "uv": {
        "pkg-path": "uv",
        "outputs": "all"
      }
    },
    "vars": {
      "INTERCOM_API_BASE": "https://api.intercom.io",
      "TRIAGE_MODEL": "claude-opus-5"
    },
    "hook": {
      "on-activate": "  venv=\"$FLOX_ENV_CACHE/venv\"\n  export UV_CACHE_DIR=\"$FLOX_ENV_CACHE/uv-cache\"\n\n  if [ ! -d \"$venv\" ]; then\n    uv venv \"$venv\" --python \"$FLOX_ENV/bin/python3.12\" --quiet\n  fi\n\n  stamp=\"$venv/.deps-$(shasum requirements.txt | cut -d' ' -f1)\"\n  if [ ! -f \"$stamp\" ]; then\n    uv pip install --python \"$venv/bin/python\" --quiet -r requirements.txt\n    rm -f \"$venv\"/.deps-*\n    touch \"$stamp\"\n  fi\n\n  if [ -f \"$venv/bin/activate\" ]; then\n    source \"$venv/bin/activate\"\n  fi\n\n  # Load .env, but let variables already set in the shell win — so\n  # `POST_NOTES=true flox activate -- ...` overrides the file.\n  if [ -f \"$FLOX_ENV_PROJECT/.env\" ]; then\n    while IFS= read -r line || [ -n \"$line\" ]; do\n      case \"$line\" in ''|'#'*) continue;; esac\n      key=${line%%=*}\n      case \"$key\" in *[!A-Za-z0-9_]*) continue;; esac\n      eval \"existing=\\${$key+set}\"\n      [ -n \"${existing:-}\" ] || export \"$key=${line#*=}\"\n    done < \"$FLOX_ENV_PROJECT/.env\"\n  fi\n\n  cd \"$FLOX_ENV_PROJECT\"\n"
    },
    "profile": {
      "common": "  serve() { uvicorn app.main:app --reload --port \"${PORT:-8000}\"; }\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "x86_64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    }
  },
