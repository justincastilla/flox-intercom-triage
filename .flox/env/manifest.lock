      "TRIAGE_MODEL": "claude-opus-5"
    },
    "hook": {
      "on-activate": "  # Load .env, but let variables already set in the shell win — so\n  # `POST_NOTES=true flox activate -- ...` overrides the file.\n  if [ -f \"$FLOX_ENV_PROJECT/.env\" ]; then\n    while IFS= read -r line || [ -n \"$line\" ]; do\n      case \"$line\" in ''|'#'*) continue;; esac\n      key=${line%%=*}\n      case \"$key\" in *[!A-Za-z0-9_]*) continue;; esac\n      eval \"existing=\\${$key+set}\"\n      [ -n \"${existing:-}\" ] || export \"$key=${line#*=}\"\n    done < \"$FLOX_ENV_PROJECT/.env\"\n  fi\n\n  cd \"$FLOX_ENV_PROJECT\"\n"
    },
    "profile": {
      "common": "  serve() { uvicorn app.main:app --reload --port \"${PORT:-8787}\"; }\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin"
      ]
    }
