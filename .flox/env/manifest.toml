schema-version = "1.14.0"

[install]
python.pkg-path = "python312"
# Published from .flox/pkgs/anthropic — the catalog's 0.75.0 lacks the 1.x
# tool_runner/strict/effort/fallbacks surface this service is built on. Isolated
# in its own pkg-group: resolving it alongside nixpkgs packages in 'toplevel'
# fails with "constraints for group 'toplevel' are too tight".
# Split per system: the darwin build was published from a laptop and the linux
# build from CI, so they sit on different catalog pages and cannot resolve in one
# group ("not found for all requested systems on the same page"). Each also needs
# its own pkg-group — resolving alongside nixpkgs in 'toplevel' is too tight.
anthropic-darwin.pkg-path = "justin-flox/anthropic"
anthropic-darwin.pkg-group = "sdk-darwin"
anthropic-darwin.systems = ["aarch64-darwin"]
anthropic-linux.pkg-path = "justin-flox/anthropic"
anthropic-linux.pkg-group = "sdk-linux"
anthropic-linux.systems = ["x86_64-linux"]
fastapi.pkg-path = "python312Packages.fastapi"
fastapi.outputs = "all"
uvicorn.pkg-path = "python312Packages.uvicorn"
uvicorn.outputs = "all"
pydantic-settings.pkg-path = "python312Packages.pydantic-settings"
pydantic-settings.outputs = "all"
psycopg.pkg-path = "python312Packages.psycopg"
psycopg.outputs = "all"
psycopg-pool.pkg-path = "python312Packages.psycopg-pool"
psycopg-pool.outputs = "all"
# git shallow-clones the source repos; ripgrep is the retrieval tool.
git.pkg-path = "git"
git.outputs = "all"
ripgrep.pkg-path = "ripgrep"
cloudflared.pkg-path = "cloudflared"

[vars]
INTERCOM_API_BASE = "https://api.intercom.io"
TRIAGE_MODEL = "claude-opus-5"

[hook]
on-activate = '''
  # Load .env, but let variables already set in the shell win — so
  # `POST_NOTES=true flox activate -- ...` overrides the file.
  if [ -f "$FLOX_ENV_PROJECT/.env" ]; then
    while IFS= read -r line || [ -n "$line" ]; do
      case "$line" in ''|'#'*) continue;; esac
      key=${line%%=*}
      case "$key" in *[!A-Za-z0-9_]*) continue;; esac
      eval "existing=\${$key+set}"
      [ -n "${existing:-}" ] || export "$key=${line#*=}"
    done < "$FLOX_ENV_PROJECT/.env"
  fi

  cd "$FLOX_ENV_PROJECT"
'''

[profile]
common = '''
  serve() { uvicorn app.main:app --reload --port "${PORT:-8787}"; }
'''

[options]
systems = ["aarch64-darwin", "x86_64-linux"]


# Runtime metadata baked into the image by `flox containerize`. The image carries
# the environment only — app/ is added by a thin Dockerfile layer on top, so a
# code change is a rebuild rather than a package republish.
[containerize.config]
exposed-ports = ["8080/tcp"]
working-dir = "/app"
cmd = ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
