# fly.toml app configuration file generated for flox-intercom-triage on 2026-09-03T16:17:19-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'flox-intercom-triage'
primary_region = 'iad'

[env]
  MIN_CONFIDENCE = '0.55'
  PORT = '8080'
  POST_NOTES = 'false'
  REPO_SYNC_MINUTES = '60'

[http_service]
  internal_port = 8080          # must match the container's uvicorn port
  force_https = true
  auto_stop_machines = 'off'
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
